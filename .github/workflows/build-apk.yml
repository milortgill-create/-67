name: Build Android APK

on:
  push:
    branches: [main, arena/80f37bfa-67]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_RELEASE: "4.7.2-stable"
  GODOT_VERSION: "4.7.2"
  APK_NAME: PhysicsSandbox67.apk
  RELEASE_TAG: apk-latest

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot editor and export templates
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" && cd "$HOME/godot"
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSL --retry 5 -o godot.zip "$BASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL --retry 5 -o templates.tpz "$BASE/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_RELEASE}_linux.x86_64" godot
          chmod +x godot
          unzip -q templates.tpz -d tpz
          TDIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TDIR"
          cp -r tpz/templates/. "$TDIR/"
          ls "$TDIR" | head -50
          "$HOME/godot/godot" --version

      - name: Configure Android SDK paths and debug keystore
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          ls "$SDK/build-tools" || true
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$SDK\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > "$HOME/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres"
          "$JAVA_HOME/bin/keytool" -genkeypair -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Import project (builds script class cache)
        run: |
          set -uo pipefail
          "$HOME/godot/godot" --headless --path . --import > import.log 2>&1 || true
          tail -n 20 import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" import.log > errs_import.log; then
            head -n 10 errs_import.log | while IFS= read -r l; do echo "::error title=Import error::${l}"; done
            exit 1
          fi

      - name: Smoke-test scripts (headless run)
        run: |
          set -uo pipefail
          timeout 120 "$HOME/godot/godot" --headless --path . --quit-after 600 > smoke.log 2>&1 || true
          cat smoke.log | tail -n 60
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|ERROR:" smoke.log > errs.log; then
            # Видно в аннотациях проверки (логи Actions недоступны извне)
            head -n 10 errs.log | while IFS= read -r l; do echo "::error title=Godot error::${l}"; done
            echo "::error title=Smoke log tail::$(tail -n 40 smoke.log | tr '\n' '|' | cut -c1-3500)"
            exit 1
          fi

      - name: Import project and export debug APK
        run: |
          set -euo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          mkdir -p build
          if ! "$HOME/godot/godot" --headless --path . --export-debug "Android" "build/$APK_NAME" > export.log 2>&1; then
            sed -E 's/\x1b\[[0-9;]*m//g' export.log | grep -v "first_scan\|\[ *[0-9]*% \]" | grep -iE "error|fail|android|sdk|template|keystore|java|export|warn|not|missing|invalid" | head -n 10 | while IFS= read -r l; do echo "::error title=Export log::${l:0:900}"; done
            sed -E 's/\x1b\[[0-9;]*m//g' export.log | tail -n 6 | tr '\n' '|' | cut -c1-900 | while IFS= read -r l; do echo "::error title=Export tail::$l"; done
            exit 1
          fi
          grep -iE "error|fail" export.log | head -n 5 || true
          ls -la build

      - name: Verify APK
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls -la build
          python3 - <<'PY'
          import zipfile, sys, os
          apk = os.path.join("build", "PhysicsSandbox67.apk")
          z = zipfile.ZipFile(apk)
          bad = z.testzip()
          names = z.namelist()
          print("zip test:", "OK" if bad is None else bad)
          print("entries:", len(names))
          for need in ["AndroidManifest.xml", "classes.dex", "lib/arm64-v8a/libgodot_android.so"]:
              print(need, "present" if need in names else "MISSING")
              if need not in names:
                  sys.exit(1)
          PY
          BT="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$BT" ] && [ -x "$BT/aapt" ]; then
            "$BT/aapt" dump badging "build/$APK_NAME" | head -n 6 || true
          else
            echo "build-tools not found, skipped aapt check"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhysicsSandbox67-apk
          path: build/${{ env.APK_NAME }}

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "Physics Sandbox 67 — APK (последняя сборка)" \
              --notes "Автоматическая сборка Android APK (Godot ${GODOT_VERSION}). Обновляется при каждом пуше."
          fi
          gh release upload "$RELEASE_TAG" "build/$APK_NAME" --clobber
